<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addresses | Pure Silver Jewelry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0a08;--panel:#14120e;--gold:#e0b51e;--bright:#ffdf58;--cream:#fffbe4;--muted:#b9b09c;--line:#51400e}
body{background:var(--bg);color:var(--cream);font-family:Poppins,sans-serif;font-size:13px;min-height:100vh}
a{text-decoration:none;color:inherit}
header{height:83px;background:#12110d;border-bottom:1px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 3.2%;gap:25px}
.brand{color:#ffd400;font-size:clamp(23px,3vw,36px);font-weight:600;letter-spacing:.5px;white-space:nowrap}
nav{display:flex;align-items:center;gap:23px}
nav a{font-size:13px;color:var(--cream)}
nav a:hover{color:var(--gold)}
nav .profile-link{background:linear-gradient(120deg,#f5d34b,#c99b09);color:#171307;padding:10px 22px;border-radius:2px;font-weight:600}
.layout{max-width:1450px;margin:30px auto 16px;padding:0 3.8%;display:grid;grid-template-columns:245px minmax(0,1fr);gap:24px;min-height:calc(100vh - 113px)}
.sidebar,.content{border:1px solid #40330e;background:linear-gradient(130deg,#15130f,#100f0c);min-height:670px}
.sidebar{padding:20px 19px 28px}
.side-group{margin-bottom:18px}
.side-heading{display:flex;align-items:center;gap:12px;color:#fffbe4;font-size:13px;font-weight:600;margin:0 0 9px}
.side-icon{width:17px;text-align:center;color:var(--gold);font-size:19px}
.side-link{display:block;margin-left:28px;padding:8px 10px;color:#c9bea2;font-size:12px;border-left:2px solid transparent}
.side-link:hover{color:var(--bright)}
.side-link.active{background:#211c0d;color:var(--bright);border-left-color:var(--gold)}
.content{padding:25px 30px 35px}
.content-head{border-bottom:1px solid #443711;padding-bottom:18px;margin-bottom:28px}
h1{font:600 30px/1.2 'Cormorant Garamond',serif;color:var(--cream)}
h1 span{color:var(--gold)}
.subtitle{font-size:12px;color:var(--muted);margin-top:5px}
.address-list{display:grid;gap:14px}
.address-card{border:1px solid #40330e;background:#100f0c;padding:17px 19px}
.address-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.recipient{font-size:13px;font-weight:700;color:var(--cream)}
.postal{font-size:13px;font-weight:600;color:#e8e0c9}
.address-text{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.7}
.card-actions{border-top:1px solid #40330e;margin-top:16px;padding-top:12px;display:flex;gap:10px}
.small-btn{font:500 11px Poppins,sans-serif;padding:8px 11px;background:transparent;cursor:pointer;border:1px solid var(--gold);color:var(--bright)}
.small-btn.active{border-color:#168c51;color:#37d17c}
.small-btn.remove{border-color:#874238;color:#e58a80}
.bottom-actions{border-top:1px solid #443711;margin-top:27px;padding-top:20px;display:flex;justify-content:flex-end}
.add-btn{display:inline-block;background:linear-gradient(120deg,#f5d34b,#c99b09);color:#171307;padding:12px 27px;font-size:11px;font-weight:600;letter-spacing:.2px}
.add-btn:hover{filter:brightness(1.1)}
.empty{padding:30px;border:1px dashed #5a4713;color:var(--muted);text-align:center}
[hidden]{display:none!important}
@media(max-width:850px){header{height:auto;min-height:83px;flex-wrap:wrap;padding:15px 4%}nav{width:100%;flex-wrap:wrap;gap:12px 18px}.layout{grid-template-columns:1fr;margin-top:18px}.sidebar{min-height:0;padding:18px;display:flex;flex-wrap:wrap;gap:16px 25px}.side-group{margin:0}.content{min-height:560px}}
@media(max-width:520px){.content{padding:20px 16px}.address-top{flex-direction:column;gap:5px}.bottom-actions{justify-content:stretch}.add-btn{text-align:center;width:100%}.brand{font-size:24px}}
</style>
</head>
<body>
<header>
  <a href="index.html" class="brand">Pure Silver Jewelry</a>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="collection/collection.html">Collection</a>
    <a href="contacts.html">Contacts</a><a href="about.html">About Us</a><a class="profile-link" href="Profile.html">Profile</a>
  </nav>
</header>
<div class="layout">
  <aside class="sidebar">
    <!-- The circled profile/avatar/edit-profile block has been removed. -->
    <div class="side-group">
      <div class="side-heading">My Account</div>
      <a class="side-link" href="Profile.html">Profile</a>
      <a class="side-link" href="Bank-Cards.html">Banks &amp; Cards</a>
      <a class="side-link active" href="Address.html">Addresses</a>
      <a class="side-link" href="Privacy-Settings.html">Privacy Settings</a>
      <a class="side-link" href="Notification-Settings.html">Notification Settings</a>
    </div>
    <div class="side-group">
      <div class="side-heading">My Purchases</div>
      <a class="side-link" href="to_pay.html">To Pay</a>
    </div>
  </aside>
  <main class="content">
    <div class="content-head">
      <h1>My <span>Addresses</span></h1>
      <p class="subtitle">Manage the delivery addresses for your orders</p>
    </div>
    <div class="address-list" id="address-list">
      <div class="empty" id="empty-address" hidden>No saved addresses yet. Click “+ Add Address” to add one.</div>
    </div>
    <div class="bottom-actions">
      <a class="add-btn" href="address1.html">＋ Add Address</a>
    </div>
  </main>
</div>
<script>
(function(){
  const list=document.getElementById('address-list');
  const empty=document.getElementById('empty-address');
  const key='pureSilverAddresses';
  function read(){
    let a=[]; try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){a=[]}
    if(!Array.isArray(a)) a=[];
    if(!a.length){try{const old=localStorage.getItem('pureSilverDeliveryAddress');if(old){a=[JSON.parse(old)];a[0].active=true;localStorage.setItem(key,JSON.stringify(a));}}catch(e){}}
    if(a.length && !a.some(x=>x.active)){a[0].active=true;localStorage.setItem(key,JSON.stringify(a));}
    return a;
  }
  let addresses=read();
  function render(){
    // Preserve the empty placeholder but clear rendered cards each refresh.
    [...list.querySelectorAll('.address-card')].forEach(el=>el.remove());
    empty.hidden=addresses.length>0;
    addresses.forEach((a,index)=>{
      const card=document.createElement('article');card.className='address-card';
      const top=document.createElement('div');top.className='address-top';
      const name=document.createElement('div');name.className='recipient';name.textContent=(a.recipient||'Recipient');
      const zip=document.createElement('div');zip.className='postal';zip.textContent=a.postal||'';
      top.append(name,zip);card.append(top);
      const line=document.createElement('p');line.className='address-text';
      line.textContent=[a.street,a.barangay,a.city,a.province,a.region,a.landmark?'Landmark: '+a.landmark:''].filter(Boolean).join(', ');
      card.append(line);
      const actions=document.createElement('div');actions.className='card-actions';
      const active=document.createElement('button');active.className='small-btn'+(a.active?' active':'');active.textContent=a.active?'Active':'Set as Active';active.type='button';
      active.addEventListener('click',()=>{addresses=addresses.map((x,i)=>({...x,active:i===index}));save();render();});
      const remove=document.createElement('button');remove.className='small-btn remove';remove.textContent='Remove';remove.type='button';
      remove.addEventListener('click',()=>{if(!confirm('Remove this saved address?'))return;addresses.splice(index,1);if(addresses.length&&!addresses.some(x=>x.active))addresses[0].active=true;save();render();});
      actions.append(active,remove);card.append(actions);list.append(card);
    });
  }
  function save(){localStorage.setItem(key,JSON.stringify(addresses));}
  render();
})();
</script>
</body>
</html>
